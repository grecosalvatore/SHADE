[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shade"
description = "SHADE: lightweight unsupervised drift detection for constrained devices"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]
dynamic = ["version"]

[project.optional-dependencies]
# Versions used for the results of the paper (Python 3.12.7). pandas and tqdm are imported by the DriftLens baseline,
# gdown downloads the embeddings. The DriftLens source is fetched by experiments/scripts/get_driftlens.sh.
experiments = [
    "numpy==1.26.4",
    "scipy==1.13.1",
    "scikit-learn==1.5.1",
    "h5py==3.11.0",
    "matplotlib==3.9.2",
    "pandas==2.2.2",
    "tqdm>=4.64",
    "gdown>=5.1",
]

[tool.setuptools]
packages = ["shade"]

[tool.setuptools.dynamic]
version = { attr = "shade.__version__" }

[tool.setuptools.package-data]
shade = ["METHOD.md"]
